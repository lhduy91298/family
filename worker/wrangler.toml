name            = "family-expense-bot"
main            = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "0 * * * *",   # Mỗi giờ — kiểm tra auto gửi email sau 2 tiếng
  "0 15 * * *",  # 15:00 UTC = 00:00 JST — nhắc lương mỗi ngày
  "0 0 1 * *"    # 00:00 UTC ngày 1 = 09:00 JST — tổng kết tháng
]
