name: Workflow 4 - AI Linter (Khi Jules làm sai)

on:
  pull_request:

jobs:
  lint-ai-mistakes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Check for require() in Worker
        run: |
          if grep -rnw 'worker/src' -e 'require('; then
            echo "❌ Lỗi: Workers dùng ES modules. Thay require() → import, module.exports → export default."
            exit 1
          fi

      - name: Check for Supabase SDK in Worker
        run: |
          if grep -rnw 'worker/src' -e '@supabase/supabase-js'; then
            echo "❌ Lỗi: Không dùng Supabase SDK trong worker/. Workers runtime không có Node.js APIs. Gọi thẳng fetch() đến Supabase REST API."
            exit 1
          fi

      - name: Check for toLocaleDateString Timezone
        run: |
          if grep -rnw 'worker/src' -e 'toLocaleDateString'; then
            echo "❌ Lỗi: Không dùng toLocaleDateString cho timezone. Không ổn định trong Workers. Tính JST thủ công: const jst = new Date(Date.now() + 9*60*60*1000)"
            exit 1
          fi

      - name: Check for English Column Names
        run: |
          if grep -rnw 'worker/src' -e 'row.salary' -e 'row.food' -e 'row.debt'; then
            echo "❌ Lỗi: Tên cột Supabase là tiếng Việt không dấu: luong, tien_an, tien_no, du_thang, tich_luy, thang"
            exit 1
          fi
