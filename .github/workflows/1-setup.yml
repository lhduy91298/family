name: Workflow 1 - Setup First Time

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy Worker?'
        required: true
        type: boolean
        default: true
      set_webhook:
        description: 'Set Telegram Webhook?'
        required: true
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      - name: Deploy Worker
        if: ${{ inputs.deploy_worker }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'worker'
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            TELEGRAM_BOT_TOKEN
            HUSBAND_ID
            HUSBAND_NAME
            MONTHLY_FOOD_BUDGET
            MONTHLY_DEBT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HUSBAND_ID: ${{ secrets.HUSBAND_ID }}
          HUSBAND_NAME: ${{ secrets.HUSBAND_NAME }}
          MONTHLY_FOOD_BUDGET: ${{ secrets.MONTHLY_FOOD_BUDGET }}
          MONTHLY_DEBT: ${{ secrets.MONTHLY_DEBT }}

      - name: Set Telegram Webhook
        if: ${{ inputs.set_webhook }}
        run: |
          WORKER_URL="https://family-expense-bot-worker.${{ secrets.CF_ACCOUNT_NAME }}.workers.dev"
          RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook?url=${WORKER_URL}")
          echo "Webhook response: $RESPONSE"
