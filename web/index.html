<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xây Chuồng</title>
  <!-- Modern Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Light Mode Palette */
      --c-bg: #f0f2f5;
      --c-bg-gradient: radial-gradient(circle at 15% 50%, rgba(29, 158, 117, 0.08), transparent 25%),
                       radial-gradient(circle at 85% 30%, rgba(0, 198, 255, 0.08), transparent 25%);
      --c-card-bg: rgba(255, 255, 255, 0.75);
      --c-card-border: rgba(255, 255, 255, 0.5);
      --c-text: #1e1e1e;
      --c-muted: #6b7280;
      --c-accent: #10b981; /* Vibrant Emerald */
      --c-accent-dark: #059669;
      --c-red: #ef4444;    /* Vibrant Red */
      --c-red-bg: rgba(239, 68, 68, 0.1);
      --c-green-bg: rgba(16, 185, 129, 0.1);
      --c-cumul-grad: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --radius: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Palette */
        --c-bg: #0f172a;
        --c-bg-gradient: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.15), transparent 30%),
                         radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.15), transparent 30%);
        --c-card-bg: rgba(30, 41, 59, 0.65);
        --c-card-border: rgba(255, 255, 255, 0.08);
        --c-text: #f8fafc;
        --c-muted: #94a3b8;
        --c-accent: #34d399;
        --c-red: #f87171;
        --c-red-bg: rgba(248, 113, 113, 0.1);
        --c-green-bg: rgba(52, 211, 153, 0.1);
      }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--c-bg);
      background-image: var(--c-bg-gradient);
      background-attachment: fixed;
      color: var(--c-text);
      min-height: 100vh;
      padding: 0 0 60px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    header {
      padding: 32px 24px 0;
      text-align: center;
      animation: fadeInDown 0.6s ease-out;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #10b981, #06b6d4, #8b5cf6);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    header p {
      font-size: 13px;
      color: var(--c-muted);
      font-weight: 500;
    }

    /* --- Cumulative Banner (compact, inline after header) --- */
    .cumul-banner {
      background: var(--c-cumul-grad);
      border-radius: 14px;
      padding: 14px 20px;
      color: #ffffff;
      box-shadow: 0 6px 20px -4px rgba(16, 185, 129, 0.35);
      margin: 10px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .cumul-banner::before {
      content: '';
      position: absolute;
      top: -20px; right: -20px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    .cumul-banner .cumul-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .cumul-banner .cumul-emoji {
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cumul-banner .cumul-label {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cumul-banner .cumul-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--c-muted);
      margin: 16px 0 10px 4px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .card {
      background: var(--c-card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--c-card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* --- Monthly Detail Rows --- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      transition: background-color 0.2s;
    }

    .row:hover {
      background-color: rgba(148, 163, 184, 0.04);
    }

    .row:last-child { border-bottom: none; }

    .row-label {
      font-size: 14px;
      color: var(--c-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row-label .icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .icon-salary  { background: rgba(59, 130, 246, 0.12); }
    .icon-food    { background: rgba(245, 158, 11, 0.12); }
    .icon-debt    { background: rgba(239, 68, 68, 0.12); }
    .icon-other   { background: rgba(139, 92, 246, 0.12); }
    .icon-surplus { background: rgba(16, 185, 129, 0.12); }

    /* Expandable "Tiền khác" */
    .row-clickable {
      cursor: pointer;
      user-select: none;
    }

    .row-clickable:hover {
      background-color: rgba(139, 92, 246, 0.04);
    }

    .chevron {
      font-size: 12px;
      color: var(--c-muted);
      transition: transform 0.3s ease;
      margin-left: 4px;
    }

    .other-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease;
      background: rgba(139, 92, 246, 0.03);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      padding: 0 20px;
    }

    .other-detail.open {
      max-height: 500px;
      padding: 8px 20px 12px;
    }

    .other-detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--c-muted);
      border-bottom: 1px dashed rgba(148, 163, 184, 0.1);
    }

    .other-detail-item:last-child {
      border-bottom: none;
    }

    .other-detail-item span:last-child {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .row-value {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .row-value.surplus  { color: var(--c-accent); }
    .row-value.deficit  { color: var(--c-red); }
    .row-value.pending  { color: var(--c-muted); font-weight: 400; font-size: 13px; }

    /* Surplus footer row */
    .row-summary {
      background: rgba(148, 163, 184, 0.04);
      border-top: 2px solid rgba(148, 163, 184, 0.1);
      border-bottom: none;
    }

    .row-summary .row-label {
      font-weight: 600;
      color: var(--c-text);
      font-size: 14px;
    }

    .row-summary .row-value {
      font-size: 18px;
      font-weight: 700;
    }

    /* (cumul-card styles removed — replaced by .cumul-banner in header section) */

    /* --- History Table --- */
    .history-wrap {
      margin: 0 -16px; /* bleed out of container padding for full width on mobile */
    }

    .history-wrap .card {
      border-radius: 16px;
      margin: 0 16px 24px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .history-table th {
      font-size: 11px;
      font-weight: 700;
      color: var(--c-muted);
      text-align: right;
      padding: 14px 10px 10px;
      border-bottom: 2px solid rgba(148, 163, 184, 0.15);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .history-table th:first-child {
      text-align: left;
      width: 22%;
      padding-left: 16px;
    }

    .history-table th:last-child {
      padding-right: 16px;
    }

    .history-table td {
      font-size: 13px;
      font-weight: 500;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      font-variant-numeric: tabular-nums;
      text-align: right;
      transition: background-color 0.2s;
    }

    .history-table td:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--c-text);
      padding-left: 16px;
    }

    .history-table td:last-child {
      font-weight: 700;
      padding-right: 16px;
    }

    .history-table tr:hover td {
      background-color: rgba(148, 163, 184, 0.04);
    }

    .history-table tr:last-child td { border-bottom: none; }

    .history-table .deficit { color: var(--c-red); }
    .history-table .surplus { color: var(--c-accent); }
    .history-table .deficit-row td { background-color: var(--c-red-bg); }

    .tag-incomplete {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-muted);
      background: rgba(148, 163, 184, 0.12);
      border-radius: 6px;
      padding: 3px 7px;
    }

    @media (min-width: 480px) {
      .history-table th { font-size: 12px; padding: 16px 12px 12px; }
      .history-table td { font-size: 14px; padding: 14px 12px; }
      .history-table th:first-child { padding-left: 20px; }
      .history-table td:first-child { padding-left: 20px; }
      .history-table th:last-child  { padding-right: 20px; }
      .history-table td:last-child  { padding-right: 20px; }
    }

    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
      padding: 20px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #app { display: none; }
    
    /* Loading Spinner */
    .loader-container {
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--c-muted);
      font-weight: 500;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      border-top-color: var(--c-accent);
      animation: spin 1s ease-in-out infinite;
    }

    #error { 
      padding: 40px 20px; 
      text-align: center; 
      color: var(--c-red); 
      background: var(--c-red-bg);
      border-radius: var(--radius);
      font-weight: 500;
      display: none; 
      margin-top: 20px;
    }

    /* Input Form Styles */
    .btn-edit {
      display: block; width: 100%; padding: 12px; margin-bottom: 24px;
      background: rgba(16, 185, 129, 0.1); color: var(--c-accent-dark);
      border: 1px solid rgba(16, 185, 129, 0.2); border-radius: var(--radius);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-edit:hover { background: rgba(16, 185, 129, 0.2); }
    
    .edit-form { padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--c-muted); }
    .form-group input {
      width: 100%; padding: 10px 14px; border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px; font-family: inherit; font-size: 14px;
      background: rgba(255, 255, 255, 0.5); color: var(--c-text);
      transition: all 0.2s ease;
    }
    .form-group input:focus { outline: none; border-color: var(--c-accent); background: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    
    .btn-save {
      display: block; width: 100%; padding: 14px; margin-top: 24px;
      background: var(--c-accent); color: white; border: none; border-radius: 12px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-save:hover { background: var(--c-accent-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Animations */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes shine {
      0% { transform: rotateZ(45deg) translate(-200%, -200%); }
      20% { transform: rotateZ(45deg) translate(200%, 200%); }
      100% { transform: rotateZ(45deg) translate(200%, 200%); }
    }
    
    /* Staggered animation delays for app children */
    #app > * { animation-fill-mode: both; }
    #app > *:nth-child(1) { animation-delay: 0.1s; }
    #app > *:nth-child(2) { animation-delay: 0.2s; }
    #app > *:nth-child(3) { animation-delay: 0.3s; }
    #app > *:nth-child(4) { animation-delay: 0.4s; }
    #app > *:nth-child(5) { animation-delay: 0.5s; }
    #app > *:nth-child(6) { animation-delay: 0.6s; }

  </style>
</head>
<body>
  <header>
    <h1>Xây Chuồng</h1>
    <p id="updated-at">Đang đồng bộ...</p>
    <div id="cumul-banner-slot"></div>
  </header>

  <div class="container">
    <div id="loading" class="loader-container">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu báo cáo...</p>
    </div>
    <div id="error">Không tải được dữ liệu. Thử lại sau.</div>
    <div id="app"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
